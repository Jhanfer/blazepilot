[changelog]
header = """
# Changelog\n
"""
body = """
---
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]($REPO/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        - **({{commit.scope}})**{% if commit.breaking %} [**breaking**]{% endif %} \
            {{ commit.message | upper_first }}\
            ([`{{ commit.id | truncate(length=7, end="") }}`]($REPO/commit/{{ commit.id }})) - {{ commit.author.name }}
    {%- endfor -%}
    {% raw %}\n{% endraw %}\
    {%- for commit in commits %}
        {%- if commit.scope -%}
        {% else -%}
            - {% if commit.breaking %} [**breaking**]{% endif %} \
                {{ commit.message | upper_first }}\
                ([`{{ commit.id | truncate(length=7, end="") }}`]($REPO/commit/{{ commit.id }})) - {{ commit.author.name }}
        {% endif -%}
    {% endfor -%}
{% endfor %}\n
"""

trim = true
render_always = true

postprocessors = [
    { pattern = '\$REPO', replace = "https://github.com/Jhanfer/blazepilot" },
]

commit_preprocessors = [
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/Jhanfer/blazepilot/issues/${2}))" },
]

link_parsers = [
    { pattern = "#(\\d+)", href = "https://github.com/Jhanfer/blazepilot/issues/$1" },
]


[git]
conventional_commits = true
filter_unconventional = true
use_body = false
require_conventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"

commit_parsers = [
    { message = "^feat", group = "✦ Features"},
    { message = "^fix", group = "✦ Bug fixes"},
    { message = "^perf", group = "✦ Performance"},
    { message = "^refactor", group = "✦ Refactor"},
    { message = "^style", group = "✦ Estilo"},
    { message = "^doc", group = "✦ Docs"},
    { message = "^test", group = "✦ Tests"},
    { message = "^chore\\(release\\):", group = "✦ Release"},
    { message = "^chore\\(deps.*\\)", skip  = true},
    { message = "^chore|^ci", group = "✦ Miscelánea"},
    { body    = ".*security", group = "✦ Seguridad"},
    { message = "^revert", group = "✦ Revert"},
]