name: Release Linux

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    outputs:
      sha256:
        value: ${{ jobs.build-linux.outputs.sha256 }}
      file:
        value: ${{ jobs.build-linux.outputs.file }}
      version:
        value: ${{ jobs.build-linux.outputs.version }}

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    outputs:
      file: ${{ steps.rename.outputs.file }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
      version: ${{ steps.rename.outputs.version }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Rust + target gnu
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libwayland-client0 \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libvulkan-dev \
            libdbus-1-dev \
            meson ninja-build libdav1d-dev \
            libasound2-dev \
            libavutil-dev libavcodec-dev libavformat-dev libswscale-dev \
            libavfilter-dev libavdevice-dev libswresample-dev \
            yasm nasm pkg-config

      - name: Compilar en modo Release
        run: cargo build --release --target x86_64-unknown-linux-gnu --features build-ci

      - name: Verificar binario
        run: |
          BIN="target/x86_64-unknown-linux-gnu/release/blazepilot"
          if [ ! -f "$BIN" ]; then
            echo "¡El binario no encontrado: $BIN!"
            exit 1
          fi
          echo "$(du -sh $BIN | cut -f1) — $BIN"

      - name: Comprimir binario con UPX
        run: |
          sudo apt-get install -y upx-ucl
          upx --best --lzma target/x86_64-unknown-linux-gnu/release/blazepilot
          echo "Tamaño post-UPX: $(du -sh target/x86_64-unknown-linux-gnu/release/blazepilot | cut -f1)"

      - name: Renombrar binario
        id: rename
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          FILE="blazepilot-x86_64-unknown-linux-gnu-v${VERSION}"
          cp target/x86_64-unknown-linux-gnu/release/blazepilot "./$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Generar checksum SHA-256
        id: checksum
        run: |
          FILE="${{ steps.rename.outputs.file }}"
          sha256sum "$FILE" > "${FILE}.sha256"
          HASH=$(cut -d' ' -f1 "${FILE}.sha256")
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "¡SHA-256: $HASH!"

      - name: Configurar Locale
        run: |
          sudo locale-gen en_US.UTF-8
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8

      - name: Generar Release Notes
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md no encontrado"
            exit 1
          fi

          CHANGELOG=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md)

          if [ -z "$CHANGELOG" ]; then
            echo "No se ha encontrado changelog para ${VERSION}"
            exit 1
          fi

          BASE_URL="https://github.com/Jhanfer/blazepilot/releases/download/v${VERSION}"

          {
            echo "body<<EOF"

            echo "# BlazePilot ${VERSION}"
            echo
            echo "$CHANGELOG"
            echo
            echo "---"
            echo
            echo "## Descargas"
            echo
            echo "- [Linux x86_64 GNU](${BASE_URL}/blazepilot-x86_64-unknown-linux-gnu-v${VERSION})"
            echo
            echo "---"
            echo
            echo "# Gracias por usar BlazePilot <3"
            echo
            echo '⢸⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⠿⠛⠉⠀⠉⠻⢿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿'
            echo '⢸⣿⣿⣿⣿⣿⣿⣿⣿⠟⠋⠁⠀⠀⠀⠀⠀⠀⠀⠈⠛⢿⣿⣿⣿⣿⣿⣿⣿⣿'
            echo '⢸⣿⣿⣿⣿⡿⠟⠉⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠈⠙⠿⣿⣿⣿⣿⣿'
            echo '⢸⣿⡿⠛⠉⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠈⠙⠻⣿⣿'
            echo '⢸⣿⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢀⣠⣶⣷⣦⣀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢹⣿'
            echo '⢸⣿⠀⠀⠀⠀⠀⠀⠀⢀⣤⣶⣿⣿⣿⣿⣿⣿⣿⣦⣄⠀⠀⠀⠀⠀⠀⠀⢸⣿'
            echo '⢸⣿⠀⠀⠀⠀⠀⠀⠀⢸⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⡇⠀⠀⠀⠀⠀⠀⢸⣿'
            echo '⢸⣿⠀⠀⠀⠀⠀⠀⠀⢸⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⡇⠀⠀⠀⠀⠀⠀⢸⣿'
            echo '⢸⣿⠀⠀⠀⠀⠀⠀⠀⢸⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⡇⢀⣤⣤⣤⣄⣄⢸⣿'
            echo '⢸⣿⠀⠀⠀⠀⠀⠀⠀⠈⠛⢿⣿⣿⣿⣿⣿⠟⠛⠛⠛⠒⠚⠁⠀⠀⠀⢸⢸⣿'
            echo '⢸⣿⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠈⠛⢿⣿⡇⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢸⢸⣿'
            echo '⢸⣿⣷⣄⡀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⡇⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢸⣿⣿'
            echo '⢸⣿⣿⣿⣿⣶⣤⡀⠀⠀⠀⠀⠀⠀⠀⠀⣷⣀⣀⣀⣀⣀⣀⣀⣀⣀⣀⣸⣿⣿'
            echo '⢸⣿⣿⣿⣿⣿⣿⣿⣷⣤⣀⠀⠀⠀⠀⠀⠈⠉⠉⢉⣩⣽⣿⣿⣿⣿⣿⣿⣿⣿'
            echo '⢸⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣷⣦⣀⠀⠀⢀⣠⣶⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿'

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Subir binario al Release
        uses: softprops/action-gh-release@v2
        with:
          files: | 
            ${{ steps.rename.outputs.file }}
            ${{ steps.rename.outputs.file }}.sha256
          tag_name: ${{ github.ref_name }}
          name: BlazePilot ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}