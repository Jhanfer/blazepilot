[package]
name = "blazepilot"
version = "0.19.1"
edition = "2024"

[[bin]]
name = "blazepilot"
path = "blaze-app/src/main.rs"

[features]
default = []
build-ci = [
    "ffmpeg-next/static",
    "ffmpeg-next/build",
    "ffmpeg-next/codec",
    "ffmpeg-next/format",
    "ffmpeg-next/filter",
    "ffmpeg-next/software-resampling",
    "ffmpeg-next/software-scaling",
]

[dependencies]
egui = { version = "0.35.0", features = ["serde"] }
egui_extras = { version = "0.35.0", default-features = false }
openssl = { version = "0.10.79", features = ["vendored"] }
once_cell = "1.19"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.18"
lru = "0.18.1"
uuid = { version = "1.24.0", features = ["v4"] }
notify = "8.2.0"
directories = "6.0.0"
serde_json = "1.0.151"
serde = "1.0.229"
chrono = "0.4.44"
crossbeam-channel = "0.5.16"
cfg-if = "1.0.4"
shell-words = "1.1.1"
mime_guess = "2.0.5"
fuzzy-matcher = "0.3.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
mimalloc = "0.1.50"
anyhow = "1.0.104"
zbus = "5.18.0"
udisks2 = "0.3.1"
libc = "0.2.188"
uzers = "0.12.2"
which = "8.0.5"
self_update = "0.44.0"
jwalk = "0.8.1"
sysinfo = "0.39.1"
postcard = { version = "1.1.3", features = ["use-std"] }
bitvec = "1.0.1"
file-id = { version = "0.2.3", features = ["serde"] }
git2 = "0.21.0"
zip = "8.6.0"
tar = "0.4"
flate2 = "1.0"
xz2 = "0.1"
bzip2 = "0.6.1"
thiserror = "2.0.19"
sha2 = "0.11.0"
dashmap = { version = "6.1.0", features = ["serde"]}
urlencoding = "2.1.3"
parking_lot = "0.12.5"
toml = "1.1.4"
resvg = "0.48.1"
imagesize = "0.15.0"
stb_image = "0.3"
image-webp = "0.2"
libavif-image = "0.14.0"
fast_image_resize = "6.0.0"
tiff = { version = "0.11.3", default-features = false, features = ["deflate", "fax", "lzw"] }
url = "2.5.8"
reqwest = "0.13.4"
cpal = "0.18.1"
ffmpeg-next = "8.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { git = "https://github.com/Jhanfer/egui-custom.git", branch = "main", default-features = false, features = ["wgpu", "x11", "wayland", "wgpu_no_default_features"] }
egui-winit = { git = "https://github.com/Jhanfer/egui-custom.git", branch = "main", default-features = false, features = ["x11", "wayland"] }
linicon = "2.3.0"
wayland-client = "0.31.14"
rustix = "1.1.4"

[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { git = "https://github.com/Jhanfer/egui-custom.git", branch = "main", default-features = false, features = ["wgpu"] }

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { git = "https://github.com/Jhanfer/egui-custom.git", branch = "main", default-features = false, features = ["wgpu"] }


[profile.dev]
debug = "line-tables-only"
opt-level = 1
split-debuginfo = "unpacked"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
debug = false
incremental = false
overflow-checks = false

[profile.release.package."*"]
opt-level = "z"

[patch.crates-io]
eframe = { git = "https://github.com/Jhanfer/egui-custom.git", branch = "main" }
egui = { git = "https://github.com/Jhanfer/egui-custom.git", branch = "main" }
egui-winit = { git = "https://github.com/Jhanfer/egui-custom.git", branch = "main" }
